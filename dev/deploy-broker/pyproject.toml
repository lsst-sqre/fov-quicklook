[project]
name = "deploy-broker"
version = "0.1.0"
description = "Dedicated deploy broker for fov-quicklook"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.117.0,<0.118.0",
    "uvicorn>=0.36.0,<0.37.0",
    "httpx>=0.28.0,<0.29.0",
    "pydantic-settings>=2.10.0,<3.0.0",
    "python-multipart>=0.0.9,<1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4.0,<9.0.0",
]

[project.scripts]
deploy-broker-daemon = "deploy_broker.daemon_cli:main"
deploy-broker-client = "deploy_broker.client:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/deploy_broker"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
