[project]
name = "quicklook"
version = "0.1.0"
description = "FOV-Quicklook backend"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.117.0,<0.118.0",
    "uvicorn>=0.36.0,<0.37.0",
    "aiohttp>=3.12.0,<4.0.0",
    "httpx>=0.28.0,<0.29.0",
    "requests>=2.32.0,<3.0.0",
    "sqlalchemy>=2.0.43",
    "pydantic-settings>=2.10.0,<3.0.0",
    "numpy>=2.3.0,<3.0.0",
    "astropy>=7.1.0,<8.0.0",
    "boto3>=1.40.0,<2.0.0",
    "minio>=7.2.0,<8.0.0",
    "lsst-daf-butler",
    "psycopg2-binary",
    "zstandard",
    "isal",
    "websockets",
    "alembic",
    "asyncpg",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4.0,<9.0.0",
    "pytest-cov>=7.0.0,<8.0.0",
    "pytest-asyncio>=1.2.0,<2.0.0",
    "pytest-env>=1.1.0,<2.0.0",
    "pytest-watch",
    "pyright>=1.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/quicklook"]

[tool.pyright]
pythonVersion = "3.12"
include = ["src", "tests"]
exclude = ["**/__pycache__", ".venv", "pyright", "docker-volumes"]
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"
